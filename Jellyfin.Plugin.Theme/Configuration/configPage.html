<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Theme</title>
</head>
<body>
    <div id="ThemeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="ThemeConfigForm">
                    <h2>Theme</h2>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="EnableInjection" name="EnableInjection" type="checkbox" is="emby-checkbox" />
                            <span>Apply the theme to the web client</span>
                        </label>
                        <div class="fieldDescription">
                            Adds the theme stylesheet and script to the web client at request time. Nothing is
                            written to disk. Turn this off if the web client stops loading; reload the page
                            afterwards.
                        </div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var ThemeConfig = {
                pluginUniqueId: '4a6cfff8-48b8-48eb-ba42-fc4d40a4b0bc'
            };

            document.querySelector('#ThemeConfigPage')
                .addEventListener('pageshow', () => {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ThemeConfig.pluginUniqueId).then((config) => {
                        document.querySelector('#EnableInjection').checked = config.EnableInjection;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#ThemeConfigForm')
                .addEventListener('submit', (e) => {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ThemeConfig.pluginUniqueId).then((config) => {
                        config.EnableInjection = document.querySelector('#EnableInjection').checked;
                        ApiClient.updatePluginConfiguration(ThemeConfig.pluginUniqueId, config)
                            .then((result) => {
                                Dashboard.processPluginConfigurationUpdateResult(result);
                            });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
